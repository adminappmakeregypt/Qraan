<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qraan — تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">
      <div class="mark">ق</div>
      <div class="brand">Qraan</div>
      <div class="muted small" id="academyName">نظام إدارة حلقات التحفيظ</div>
    </div>

    <!-- إعداد أول مرة -->
    <form id="setupForm" class="hidden">
      <div class="note">أول تشغيل: أنشئ حساب المدير.</div>
      <div class="field"><label>اسم الأكاديمية</label><input name="academy" required value="أكاديمية Qraan"></div>
      <div class="field"><label>البريد الإلكتروني للمدير</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input name="password" type="password" minlength="6" required autocomplete="new-password"></div>
      <div class="row">
        <div class="field"><label>رقم واتساب الأكاديمية</label><input name="whatsapp" placeholder="01xxxxxxxxx"></div>
        <div class="field"><label>بلد المدير</label><select name="adminCountry"></select></div>
      </div>
      <button class="btn block">إنشاء الحساب والدخول</button>
    </form>

    <!-- تسجيل الدخول -->
    <div id="loginBox" class="hidden">
      <div class="seg">
        <button type="button" data-tab="teacher" class="active">محفظ</button>
        <button type="button" data-tab="supervisor">مشرفة</button>
        <button type="button" data-tab="admin">المدير</button>
      </div>
      <form id="teacherForm">
        <div class="field"><label>اسم المستخدم</label><input name="username" required autocomplete="username"></div>
        <div class="field"><label>الرقم الخاص بك</label><input name="code" inputmode="numeric" required></div>
        <button class="btn block">دخول</button>
      </form>
      <form id="supervisorForm" class="hidden">
        <div class="field"><label>اسم المستخدم</label><input name="username" required autocomplete="username"></div>
        <div class="field"><label>الرقم الخاص بك</label><input name="code" inputmode="numeric" required></div>
        <button class="btn block">دخول</button>
      </form>
      <form id="adminForm" class="hidden">
        <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn block">دخول لوحة التحكم</button>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script>
  $('[name=adminCountry]').innerHTML = countryOptions('EG');
  const busy = (form, on) => { const b = $('button', form); b.disabled = on; b.dataset.t ||= b.textContent; b.textContent = on ? 'جارٍ الدخول...' : b.dataset.t; };

  (async () => {
    if (!fbInit()) return fatal('<h3>تعذر تحميل Firebase</h3><p class="muted">تأكد من الاتصال بالإنترنت ومن ملف firebase-config.js</p>');
    const user = await authUser();
    if (user) {   // جلسة مفتوحة ← توجيه للصفحة المناسبة
      try { const p = await resolveProfile(user); if (p) return location.href = PAGE[p.role]; } catch (e) {}
      await FB.auth.signOut();
    }
    let owner = false;
    try {
      owner = (await FB.fs.collection('meta').doc('owner').get()).exists;
      const pub = await FB.fs.collection('meta').doc('public').get();
      if (pub.exists && pub.data().academy) { applyBrand(pub.data().academy); $('#academyName').textContent = 'نظام إدارة حلقات التحفيظ'; }
    } catch (e) { toast('تعذر الاتصال: ' + errMsg(e), true); }
    $(owner ? '#loginBox' : '#setupForm').classList.remove('hidden');
  })();

  $$('.seg button').forEach(b => b.onclick = () => {
    $$('.seg button').forEach(x => x.classList.toggle('active', x === b));
    $('#teacherForm').classList.toggle('hidden', b.dataset.tab !== 'teacher');
    $('#supervisorForm').classList.toggle('hidden', b.dataset.tab !== 'supervisor');
    $('#adminForm').classList.toggle('hidden', b.dataset.tab !== 'admin');
  });

  // أول تشغيل: إنشاء حساب المدير (مرة واحدة فقط — القاعدة تمنع إنشاء مدير تاني)
  $('#setupForm').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); busy(e.target, true);
    try {
      const cred = await FB.auth.createUserWithEmailAndPassword(f.email.trim(), f.password);
      await FB.fs.collection('meta').doc('owner').set({ uid: cred.user.uid, email: cred.user.email, createdAt: Date.now() });
      const main = { ...defaultSettings(), academy: f.academy.trim() || 'Qraan', whatsapp: f.whatsapp.trim(), adminCountry: f.adminCountry };
      SECRET_KEYS.forEach(k => delete main[k]); delete main.adminHash; delete main.adminEmail;
      await FB.fs.collection('settings').doc('main').set(main);
      await FB.fs.collection('meta').doc('public').set({ academy: main.academy });
      location.href = 'admin.html';
    } catch (err) { busy(e.target, false); toast(errMsg(err), true); }
  };

  $('#adminForm').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); busy(e.target, true);
    try { await FB.auth.signInWithEmailAndPassword(f.email.trim(), f.password); location.href = 'admin.html'; }
    catch (err) { busy(e.target, false); toast(err.code === 'auth/invalid-credential' ? 'البريد أو كلمة المرور غير صحيحة' : errMsg(err), true); }
  };

  // المحفظ والمشرفة: اسم المستخدم + الرقم
  async function codeLogin(e, role) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); busy(e.target, true);
    try {
      const cred = await FB.auth.signInWithEmailAndPassword(await emailOf(f.username), pwOf(f.code));
      const p = await resolveProfile(cred.user);
      if (!p) { await FB.auth.signOut(); throw { code: 'auth/user-not-found' }; }
      location.href = PAGE[p.role];
    } catch (err) { busy(e.target, false); toast(errMsg(err), true); }
  }
  $('#teacherForm').onsubmit = e => codeLogin(e, 'teacher');
  $('#supervisorForm').onsubmit = e => codeLogin(e, 'supervisor');
</script>
</body>
</html>
