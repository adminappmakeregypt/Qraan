<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qraan — تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">
      <div class="mark">ق</div>
      <div class="brand">Qraan</div>
      <div class="muted small">نظام إدارة حلقات التحفيظ</div>
    </div>

    <div id="loading" class="empty">جارٍ التحميل...</div>

    <!-- إعداد أول مرة -->
    <form id="setupForm" class="hidden">
      <div class="note">أول تشغيل: أنشئ حساب المدير.</div>
      <div class="field"><label>اسم الأكاديمية</label><input name="academy" required value="أكاديمية Qraan"></div>
      <div class="field"><label>البريد الإلكتروني للمدير</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input name="password" type="password" minlength="6" required autocomplete="new-password"></div>
      <div class="row">
        <div class="field"><label>رقم واتساب الأكاديمية</label><input name="whatsapp" placeholder="01xxxxxxxxx"></div>
        <div class="field"><label>بلد المدير</label><select name="adminCountry"></select></div>
      </div>
      <button class="btn block">إنشاء الحساب والدخول</button>
    </form>

    <!-- تسجيل الدخول -->
    <div id="loginBox" class="hidden">
      <div class="seg">
        <button type="button" data-tab="teacher" class="active">محفظ / مشرفة</button>
        <button type="button" data-tab="admin">المدير</button>
      </div>
      <form id="teacherForm">
        <div class="field"><label>اسم المستخدم</label><input name="username" required autocomplete="username"></div>
        <div class="field"><label>الرقم الخاص بك</label><input name="code" inputmode="numeric" required></div>
        <button class="btn block">دخول</button>
      </form>
      <form id="adminForm" class="hidden">
        <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn block">دخول لوحة التحكم</button>
        <p style="text-align:center;margin:12px 0 0"><a href="#" id="forgot" class="small">نسيت كلمة المرور؟</a></p>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script>
(async () => {
  let F;
  try { F = fbInit(); } catch (e) { if (e.message === 'config') return configMissingScreen(); $('#loading').textContent = e.message; return; }
  $('[name=adminCountry]').innerHTML = countryOptions('EG');
  const busy = (form, on) => { const b = $('button:not([type=button])', form); b.disabled = on; b.dataset.t ||= b.textContent; b.textContent = on ? 'جارٍ...' : b.dataset.t; };
  const errMsg = e => ({
    'auth/invalid-credential': 'بيانات الدخول غير صحيحة', 'auth/wrong-password': 'بيانات الدخول غير صحيحة', 'auth/user-not-found': 'بيانات الدخول غير صحيحة',
    'auth/too-many-requests': 'محاولات كثيرة — انتظر قليلًا ثم حاول', 'auth/email-already-in-use': 'هذا البريد مستخدم بالفعل',
    'auth/weak-password': 'كلمة المرور ضعيفة', 'auth/network-request-failed': 'لا يوجد اتصال بالإنترنت',
    'auth/unauthorized-domain': 'هذا الموقع غير مضاف في Firebase ← Authentication ← Authorized domains',
  }[e.code] || e.message);

  // من مسجل دخوله بالفعل؟
  let routing = false;
  async function route(u) {
    if (routing) return; routing = true;
    try {
      if ((await F.fs.doc(P('admins') + '/' + u.uid).get()).exists) return location.href = 'admin.html';
      const t = await F.fs.collection(P('teachers')).where('uid', '==', u.uid).get();
      if (!t.empty && t.docs[0].data().active !== false) return location.href = 'teacher.html';
      const s = t.empty ? await F.fs.collection(P('supervisors')).where('uid', '==', u.uid).get() : { empty: true };
      if (!s.empty && s.docs[0].data().active !== false) return location.href = 'supervisor.html';
      await F.auth.signOut(); toast(t.empty && s.empty ? 'الحساب غير مرتبط بمحفظ أو مشرفة' : 'الحساب موقوف — تواصل مع الإدارة', true);
    } catch (e) { console.error(e); await F.auth.signOut(); toast(errMsg(e), true); }
    routing = false; showForms();
  }
  async function showForms() {
    $('#loading').classList.add('hidden');
    let setupDone = true;
    try { setupDone = (await F.fs.doc(P('config') + '/setup').get()).exists; }
    catch (e) {
      console.error(e);
      if (e.code === 'permission-denied') {
        $('#loading').classList.remove('hidden');
        $('#loading').innerHTML = '<div class="note" style="text-align:right">⚠️ قواعد الحماية لسه متنشرتش في Firebase.<br>افتح ملف <b>firestore.rules</b> وانسخ محتواه، ثم في Firebase ← Firestore ← <b>Rules</b> الصقه واضغط <b>Publish</b>، وبعدين حدّث الصفحة (F5).</div>';
        return;
      }
    }
    $('#setupForm').classList.toggle('hidden', setupDone);
    $('#loginBox').classList.toggle('hidden', !setupDone);
  }
  let firstAuth = true;
  F.auth.onAuthStateChanged(u => {
    if (!firstAuth) return; firstAuth = false;
    if (u) route(u); else showForms();
  });

  $$('.seg button').forEach(b => b.onclick = () => {
    $$('.seg button').forEach(x => x.classList.toggle('active', x === b));
    $('#teacherForm').classList.toggle('hidden', b.dataset.tab !== 'teacher');
    $('#adminForm').classList.toggle('hidden', b.dataset.tab !== 'admin');
  });

  $('#setupForm').onsubmit = async e => {
    e.preventDefault(); busy(e.target, true);
    const f = Object.fromEntries(new FormData(e.target));
    try {
      let u;
      try { u = (await F.auth.createUserWithEmailAndPassword(f.email.trim(), f.password)).user; }
      catch (err) {   // الإيميل متسجل قبل كده (من نسخة قديمة) ← ندخل بيه بنفس كلمة المرور
        if (err.code !== 'auth/email-already-in-use') throw err;
        try { u = (await F.auth.signInWithEmailAndPassword(f.email.trim(), f.password)).user; }
        catch (e2) { throw { code: 'x', message: 'الإيميل ده متسجل قبل كده بكلمة مرور مختلفة — اكتب كلمة المرور القديمة، أو استخدم «نسيت كلمة المرور» من صفحة الدخول' }; }
      }
      const b = F.fs.batch();
      b.set(F.fs.doc(P('config') + '/setup'), { adminUid: u.uid, at: Date.now() });
      b.set(F.fs.doc(P('admins') + '/' + u.uid), { email: u.email, at: Date.now() });
      await b.commit();
      await F.fs.doc(P('settings') + '/main').set({ ...defaultSettings(), academy: f.academy.trim(), whatsapp: f.whatsapp.trim(), adminCountry: f.adminCountry });
      location.href = 'admin.html';
    } catch (err) { console.error(err); toast(errMsg(err), true); busy(e.target, false); }
  };

  $('#adminForm').onsubmit = async e => {
    e.preventDefault(); busy(e.target, true);
    const f = Object.fromEntries(new FormData(e.target));
    try { const u = (await F.auth.signInWithEmailAndPassword(f.email.trim(), f.password)).user; routing = false; await route(u); }
    catch (err) { toast(errMsg(err), true); }
    busy(e.target, false);
  };

  $('#teacherForm').onsubmit = async e => {
    e.preventDefault(); busy(e.target, true);
    const f = Object.fromEntries(new FormData(e.target));
    try {
      const u = (await F.auth.signInWithEmailAndPassword(await teacherEmail(f.username), teacherPass(f.code))).user;
      routing = false; await route(u);
    } catch (err) { toast(err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' ? 'اسم المستخدم أو الرقم غير صحيح' : errMsg(err), true); }
    busy(e.target, false);
  };

  $('#forgot').onclick = async e => {
    e.preventDefault();
    const email = $('#adminForm [name=email]').value.trim();
    if (!email) return toast('اكتب بريدك الإلكتروني أولًا', true);
    try { await F.auth.sendPasswordResetEmail(email); toast('تم إرسال رابط إعادة تعيين كلمة المرور لبريدك'); }
    catch (err) { toast(errMsg(err), true); }
  };
})();
</script>
</body>
</html>
